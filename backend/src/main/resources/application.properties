spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:nutriverse}


groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=openai/gpt-oss-20b

spring.neo4j.uri=${NEO4J_URI:neo4j://127.0.0.1:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

usda.api.key=${USDA_API_KEY}
usda.api.url=https://api.nal.usda.gov/fdc/v1
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

server.address=0.0.0.0
server.port=8080